name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

      matrix:
        include:
          - elixir: 1.18.x
            otp: 27
          - elixir: 1.19.x
            otp: 28
          - elixir: 1.20.x
            otp: 29

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: install dependencies
        run: mix do deps.get, deps.compile

      - name: check formatting
        run: mix format --check-formatted

      - name: check compilation
        run: mix compile --warnings-as-errors

      - name: analyse code
        run: mix credo --strict

      - name: Run tests
        run: mix test

  rabbitmq:
    name: rabbitmq integration tests
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

      matrix:
        include:
          - elixir: 1.18.x
            otp: 27
          - elixir: 1.19.x
            otp: 28
          - elixir: 1.20.x
            otp: 29

    services:
      rabbitmq:
        image: rabbitmq:4.3.2-management
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: install dependencies
        run: mix deps.get

      - name: Wait for RabbitMQ
        run: |
          for i in {1..30}; do
            if curl -sS -u guest:guest http://localhost:15672/api/overview > /dev/null 2>&1; then
              echo "RabbitMQ is up"
              exit 0
            fi
            echo "Waiting for RabbitMQ..."
            sleep 2
          done
          echo "RabbitMQ did not become ready in time"
          exit 1

      - name: Run RabbitMQ integration tests
        run: mix test --only rabbitmq
